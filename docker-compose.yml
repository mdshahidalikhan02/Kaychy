services:
  postgres:
    image: postgis/postgis:16-3.4
    container_name: kaychy-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: kaychy
      POSTGRES_USER: kaychy
      POSTGRES_PASSWORD: kaychy
    ports:
      - "5432:5432"
    volumes:
      - kaychy-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kaychy -d kaychy"]
      interval: 5s
      timeout: 5s
      retries: 10
  redis:
    image: redis:7-alpine
    container_name: kaychy-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - kaychy-redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  kaychy-postgres-data:
  kaychy-redis-data:
