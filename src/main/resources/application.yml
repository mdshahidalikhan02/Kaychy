spring:
  application:
    name: kaychy
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/kaychy}
    username: ${DB_USERNAME:kaychy}
    password: ${DB_PASSWORD:kaychy}
    driver-class-name: org.postgresql.Driver
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
server:
  port: ${SERVER_PORT:8080}
management:
  endpoints:
    web:
      exposure:
        include: health,info,flyway,metrics
  endpoint:
    health:
      show-details: when_authorized
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
